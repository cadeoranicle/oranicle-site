<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Oranicle • Anchor Semantics Review UI</title>

<style>
:root {
  --bg:#0b0f14;
  --panel:#111823;
  --text:#e9eef6;
  --muted:#98a2b3;
  --accent:#6ee7ff;
  --ok:#9efbc6;
  --warn:#ffd37a;
  --err:#ff9aa2;
}

html,body{
  height:100%;
  margin:0;
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  background:var(--bg);
  color:var(--text);
}

.wrap{
  display:grid;
  grid-template-columns:0.9fr 1.1fr;
  gap:14px;
  padding:14px;
  height:100%;
  box-sizing:border-box;
}

.card{
  background:var(--panel);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,0.35);
}

.card h2{
  margin:0;
  padding:12px 14px;
  font-size:14px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  color:#dbe7ff;
}

.toolbar{
  display:flex;
  gap:10px;
  align-items:center;
  padding:10px 14px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  flex-wrap:wrap;
}

.toolbar input{
  background:#0a0f16;
  color:var(--text);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:10px;
  padding:8px 10px;
  width:340px;
}

.btn{
  background:#0a0f16;
  color:var(--text);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:10px;
  padding:8px 10px;
  cursor:pointer;
}

.btn.primary{
  border-color:rgba(110,231,255,0.55);
  box-shadow:0 0 0 3px rgba(110,231,255,0.12) inset;
}

.hint{ color:var(--muted); font-size:12px; }
.mono{ font-family:ui-monospace,monospace; }
.ok{ color:var(--ok); }
.warn{ color:var(--warn); }
.err{ color:var(--err); }

.list{
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:12px 14px;
  overflow:auto;
}

.anchorCard{
  background:#0a0f16;
  border:1px solid rgba(255,255,255,0.10);
  border-radius:14px;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.anchorHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

input[type=text], textarea{
  width:100%;
  box-sizing:border-box;
  background:#0b111a;
  color:var(--text);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:10px;
  padding:8px 10px;
  font-size:13px;
}

textarea{ min-height:60px; resize:vertical; }

table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

th,td{
  text-align:left;
  padding:6px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

.dirUp{ color:var(--ok); }
.dirDown{ color:var(--warn); }
.dirFlat{ color:var(--muted); }

</style>
</head>

<body>
<div class="wrap">

<div class="card">
<h2>Semantics Review</h2>

<div class="toolbar">
  <label class="hint">canonicalId:</label>
  <input id="canonId" class="mono" />
  <button class="btn" id="loadBtn">Load</button>
  <button class="btn" id="resetBtn">Reset</button>
  <button class="btn primary" id="approveBtn">Approve & Download</button>
  <span id="status" class="hint"></span>
</div>

<div id="sourceBox" style="display:none; padding:12px;">
  <div class="hint">Provenance</div>
  <div id="sourceText" class="mono hint"></div>
</div>

</div>

<div class="card">
<h2>Anchors</h2>
<div id="anchorsList" class="list">
  <div class="hint">Load a canonical.</div>
</div>
</div>

</div>

<script>
const $ = id => document.getElementById(id);
const statusEl = $("status");
const anchorsList = $("anchorsList");
const sourceBox = $("sourceBox");
const sourceText = $("sourceText");

let semantics = null;
let semanticsProposed = null;

function setStatus(msg, cls=""){
  statusEl.className = "hint " + cls;
  statusEl.textContent = msg;
}

function qp(name, fallback=null){
  const u = new URL(window.location.href);
  return u.searchParams.get(name) ?? fallback;
}

function downloadJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function render(){
  if(!semantics?.anchors) return;

  anchorsList.innerHTML = "";

  for(const key of Object.keys(semantics.anchors)){
    const a = semantics.anchors[key];

    const card = document.createElement("div");
    card.className="anchorCard";

    card.innerHTML = `
      <div class="anchorHeader">
        <b class="mono">${key}</b>
        <button class="btn" data-restore="${key}">Restore</button>
      </div>

      <div class="grid2">
        <div>
          <label>Label</label>
          <input type="text" data-key="${key}" data-field="label" value="${a.label ?? ""}">
        </div>
        <div>
          <label>Summary</label>
          <textarea data-key="${key}" data-field="summary">${a.summary ?? ""}</textarea>
        </div>
      </div>

      <table>
        <thead>
          <tr><th>feature</th><th>direction</th><th>delta_z</th><th>delta_%</th></tr>
        </thead>
        <tbody>
          ${(a.top_features ?? []).map(r => `
            <tr>
              <td class="mono">${r.feature ?? ""}</td>
              <td>${r.direction ?? ""}</td>
              <td class="mono">${r.delta_z?.toFixed(3) ?? ""}</td>
              <td class="mono">${r.delta_pct?.toFixed(1) ?? ""}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;

    anchorsList.appendChild(card);
  }

  anchorsList.querySelectorAll("input,textarea").forEach(el=>{
    el.addEventListener("input",e=>{
      const k=e.target.dataset.key;
      const f=e.target.dataset.field;
      semantics.anchors[k][f]=e.target.value;
    });
  });

  anchorsList.querySelectorAll("button[data-restore]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const k=btn.dataset.restore;
      semantics.anchors[k].label=semanticsProposed.anchors[k].label;
      semantics.anchors[k].summary=semanticsProposed.anchors[k].summary;
      render();
    });
  });
}

async function loadCanonical(canonId){
  try{
    setStatus("Loading…","warn");

    const base = `/canonicals/${canonId}`;
    const urls = [
      `${base}/pca_geometry_C1_C2.semantics.authoritative.json`,
      `${base}/pca_geometry_C1_C2.semantics.json`
    ];

    let data=null;

    for(const u of urls){
      try{
        const r=await fetch(u,{cache:"no-store"});
        if(r.ok){
          data=await r.json();
          console.log("Loaded from:",u);
          break;
        }
      }catch{}
    }

    if(!data) throw new Error("No semantics JSON found.");

    semantics=data;
    semanticsProposed=JSON.parse(JSON.stringify(data));

    if(data.source){
      sourceBox.style.display="block";
      sourceText.textContent=JSON.stringify(data.source,null,2);
    }else{
      sourceBox.style.display="none";
    }

    render();
    setStatus("Ready.","ok");

  }catch(e){
    console.error(e);
    setStatus("Load failed.","err");
  }
}

$("loadBtn").addEventListener("click",()=>loadCanonical($("canonId").value.trim()));

$("resetBtn").addEventListener("click",()=>{
  if(!semanticsProposed) return;
  semantics=JSON.parse(JSON.stringify(semanticsProposed));
  render();
});

$("approveBtn").addEventListener("click",()=>{
  if(!semantics) return;
  const canonId=$("canonId").value.trim();
  const out={
    canonical_id:canonId,
    approved_at_utc:new Date().toISOString(),
    source:semantics.source ?? {},
    anchors:semantics.anchors
  };
  downloadJSON(out,"pca_geometry_C1_C2.semantics.authoritative.json");
});

const initial = qp("canonicalId","ORANICLE_TRISTATE_CANONICAL_V1");
$("canonId").value = initial;
setStatus("Set canonicalId, click Load.");

</script>
</body>
</html>
