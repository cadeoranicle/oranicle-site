<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SKU2</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div class="app-shell">

        <!-- LHS panel -->
        <div class="panel left-panel">
            <div class="panel-inner">
                <h1 id="sku2Title" class="page-title">Provider Canonical Viewer</h1>

                <p id="sku2Subtitle" class="page-subtitle">
                    Tri-state behavioral manifold with hull, anchors, and reference provider.
                </p>

                <div id="cameraPresetBar" style="margin:12px 0 16px 0;">
                    <button id="btnPresetA1A2" type="button" style="
                        padding:8px 14px;
                        border:1px solid #2d3a48;
                        border-radius:8px;
                        background:#101922;
                        color:#e8eef5;
                        cursor:pointer;
                        font-size:14px;">
                        A1–A2 View
                    </button>
                </div>

                <div class="section">
                    <div class="viewer-shell">
                        <iframe id="canonicalViewer" title="NYNJCT canonical viewer" src="about:blank"
                            style="width:100%; height:560px; border:0; display:block; background:#000; border-radius:16px;">
                        </iframe>
                    </div>
                </div>

                <div id="providerMetricBar" style="margin-top:12px; display:flex; flex-wrap:wrap; gap:10px;">
                    <button id="cta_axis_position" class="metric-btn">
                        Axis Position
                    </button>
                    <button id="cta_centroid_distance" class="metric-btn">
                        Center Distance
                    </button>
                    <button id="cta_canonical_region" class="metric-btn">
                        Region
                    </button>
                    <button id="cta_density_rarity" class="metric-btn">
                        Density
                    </button>
                    <button id="cta_nearest_anchor" class="metric-btn">Nearest Anchor</button>
                    <button id="cta_extremity_relation" class="metric-btn">
                        Extremity
                    </button>
                    <button id="cta_frontier_relation" class="metric-btn">
                        Frontier
                    </button>
                </div>
            </div>
        </div>

        <!-- RHS panel -->
        <div class="panel right-panel">
            <div class="panel-inner">
                <h2 class="section-title">Narrative Panel</h2>
                <p id="sku2Narrative" class="copy">
                    Semantic interpretation will appear here.
                </p>
            </div>
        </div>

    </div>

    <script src="js/sku2.js"></script>
</body>

</html>
