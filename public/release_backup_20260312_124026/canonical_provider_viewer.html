<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Canonical Viewer</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            display: flex;
            width: 100%;
            height: 100%;
        }

        #plot {
            width: 100%;
            height: 100%;
            flex: 1 1 auto;
        }

        #viewerMessage {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: #0a1118;
            color: #9fb0c3;
            padding: 32px;
            box-sizing: border-box;
        }

        #viewerMessage .inner {
            max-width: 560px;
        }

        #viewerMessage .icon {
            font-size: 40px;
            margin-bottom: 12px;
            color: #e8eef5;
        }

        #viewerMessage .title {
            font-size: 20px;
            margin-bottom: 10px;
            color: #e8eef5;
        }

        #viewerMessage .text {
            font-size: 14px;
            line-height: 1.6;
        }
    </style>


</head>

<body>
    <div id="plot"></div>

    <div id="viewerMessage">
        <div class="inner">
            <div class="icon">⌄</div>
            <div class="title">Viewer loading</div>
            <div class="text">Preparing canonical manifold…</div>
        </div>
    </div>

    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script src="js/canonical_provider_viewer_runtime.js"></script>
</body>

</html>
