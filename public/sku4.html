<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SKU4 — CPT Canonical</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="/css/sku4.css">

    <style>
        body {
            background: #06101c;
            color: #d8e1ea;
            font-family: system-ui;
        }

        .sku4-shell {
            padding: 16px;
        }

        .sku4-main-grid {
            display: flex;
            gap: 16px;
        }

        [data-sku4-panel="panel3"] {
            width: 55%;
        }

        [data-sku4-panel="panel4"] {
            width: 45%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .sku4-panel {
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.02);
        }

        .sku4-title {
            font-size: 18px;
            font-weight: 700;
        }

        .sku4-subtitle {
            font-size: 13px;
            opacity: 0.7;
        }

        .sku4-pill {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>

    <div class="sku4-shell">

        <div data-sku4-root>

            <!-- PANEL 1 -->
            <section data-sku4-panel="panel1"></section>

            <!-- PANEL 2 -->
            <section data-sku4-panel="panel2"></section>

            <!-- MAIN -->
            <div class="sku4-main-grid">
                <section data-sku4-panel="panel3"></section>
                <section data-sku4-panel="panel4"></section>
            </div>

            <!-- PANEL 5 -->
            <section data-sku4-panel="panel5"></section>

        </div>

    </div>
    <!-- Context FIRST -->
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);

            window.SKU4_ENTRY_CONTEXT = {
                region: params.get('region') || 'NYNJCT',
                npi: params.get('npi') || '',
                family: params.get('family') || 'Billing-CPT'
            };
        })();
    </script>

    <!-- Core libs -->
    <script src="/js/plotly-2.35.2.min.js"></script>

    <!-- Registry -->
    <script src="/js/sku4-registry.js"></script>

    <!-- Loader (raw data) -->
    <script src="/js/sku4-loader.js"></script>

    <!-- 🔥 VERY IMPORTANT: SKU renderer BEFORE panel engine -->
    <script src="/js/SKU4_Frontend_based_scripts/sku4.01.js"></script>

    <!-- Intelligence layer -->
    <script src="/js/SKU4_domain_specific_loaders/sku4-loader-financial-intelligence.js"></script>

    <script src="/js/SKU4_Frontend_based_scripts/sku4.50.js"></script>
    <script src="/js/SKU4_Frontend_based_scripts/sku4.51.js"></script>
    <script src="/js/SKU4_Frontend_based_scripts/sku4.52.js"></script>
    <script src="/js/SKU4_Frontend_based_scripts/sku4.53.js"></script>
    <script src="/js/SKU4_Frontend_based_scripts/sku4.54.js"></script>
    <script src="/js/SKU4_Frontend_based_scripts/sku4.55.js"></script>
    <script src="/js/SKU4_Frontend_based_scripts/sku4.56.js"></script>
    <script src="/js/SKU4_Frontend_based_scripts/sku4.58.js"></script>
    <script src="/js/SKU4_Frontend_based_scripts/sku4.60.js"></script>
    <!-- Panel engine (dispatcher) -->
    <script src="/js/sku4-panel-engine.js"></script>

    <!-- Index LAST -->
    <script src="/js/sku4-index.js"></script>

</body>

</html>
